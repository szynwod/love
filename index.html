<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Nasza rocznica</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, rgba(245, 230, 255, 0.95), rgba(255, 233, 240, 0.95)), url('https://agi-prod-file-upload-public-main-use1.s3.amazonaws.com/86542158-a91f-4e12-b923-ee8d260da241') center/cover;
      background-attachment: fixed;
      font-family: "Montserrat", Arial, sans-serif;
      position: relative;
    }

    /* Śnieg w tle */
    .snow {
      pointer-events: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(2px 2px at 20px 20px, rgba(255,255,255,0.9) 50%, transparent 51%),
        radial-gradient(3px 3px at 80px 40px, rgba(255,255,255,0.8) 50%, transparent 51%),
        radial-gradient(2px 2px at 50px 90px, rgba(255,255,255,0.9) 50%, transparent 51%);
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: snowFall 15s linear infinite;
      z-index: 1;
    }

    @keyframes snowFall {
      0%   { transform: translateY(-100px); }
      100% { transform: translateY(100px); }
    }

    .frame {
      width: 90vw;
      height: 90vh;
      max-width: 650px;
      max-height: 900px;
      background: linear-gradient(to bottom, rgba(253, 253, 253, 0.96) 0%, rgba(250, 249, 247, 0.96) 100%);
      border: 14px solid #111;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45);
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      color: #5b3b25;
      position: relative;
      z-index: 2;
    }

    .title-number {
      font-size: 7vh;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .title-text {
      font-size: 5vh;
      font-family: "Pacifico", cursive;
      margin-top: -6px;
    }

    .subtitle {
      font-size: 2vh;
      margin-top: 4px;
      color: #7a5a3a;
    }

    .rows {
      margin-top: 8px;
      line-height: 1.35;
      font-size: 2.4vh;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .row span.value {
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .small-note {
      font-size: 1.8vh;
      margin-top: 4px;
      color: #8a6a47;
    }

    .heart {
      width: 7vh;
      height: 6.5vh;
      background: #e32652;
      position: relative;
      margin: 0.8vh auto;
      transform: rotate(-45deg);
      animation: heartbeat 1.2s ease-in-out infinite, heartColor 3s ease-in-out infinite;
      box-shadow: 0 0 16px rgba(227,38,82,0.55);
      cursor: pointer;
      transition: filter 0.3s ease;
    }

    .heart:hover {
      filter: brightness(1.1);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 7vh;
      height: 7vh;
      background: #e32652;
      border-radius: 50%;
      top: -3.5vh;
      left: 0;
      animation: heartColor 3s ease-in-out infinite;
    }
    .heart::after {
      left: 3.5vh;
      top: 0;
    }

    @keyframes heartbeat {
      0%   { transform: scale(0.9) rotate(-45deg); }
      25%  { transform: scale(1.05) rotate(-45deg); }
      45%  { transform: scale(1.12) rotate(-45deg); }
      60%  { transform: scale(1.02) rotate(-45deg); }
      100% { transform: scale(0.9) rotate(-45deg); }
    }

    @keyframes heartColor {
      0%, 100% { background-color: #e32652; }
      50% { background-color: #ff4373; }
    }

    .heart-icon {
      font-size: 1.2vh;
      margin-top: 2px;
      animation: floatHearts 2s ease-in-out infinite;
    }

    @keyframes floatHearts {
      0%, 100% { transform: translateY(0px); opacity: 1; }
      50% { transform: translateY(-8px); opacity: 0.8; }
    }

    .divider {
      width: 60%;
      border-bottom: 1px solid #d1bfa9;
      margin: 6px auto 4px;
    }

    .bottom-text {
      font-family: "Pacifico", cursive;
      font-size: 3vh;
      margin-top: 4px;
    }

    .names-line {
      font-size: 2.1vh;
      margin-top: 6px;
      letter-spacing: 0.16em;
    }

    .names-line .heart-small {
      color: #e32652;
      margin: 0 4px;
      font-size: 2.1vh;
    }

    .hashtag {
      font-size: 1.3vh;
      color: rgba(139, 106, 71, 0.5);
      margin-top: 8px;
      font-style: italic;
    }

    .counter-label {
      font-size: 1.5vh;
      color: #9a7a5a;
      margin-top: 6px;
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(227, 38, 82, 0.8);
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background: rgba(227, 38, 82, 1);
      transform: scale(1.1);
    }

    body.dark-mode {
      background: linear-gradient(135deg, rgba(42, 42, 58, 0.95), rgba(58, 42, 58, 0.95)), url('https://agi-prod-file-upload-public-main-use1.s3.amazonaws.com/86542158-a91f-4e12-b923-ee8d260da241') center/cover !important;
      background-attachment: fixed;
    }

    body.dark-mode .frame {
      background: linear-gradient(to bottom, rgba(45, 45, 45, 0.96) 0%, rgba(31, 31, 31, 0.96) 100%);
      color: #f0e6d2;
      border-color: #555;
    }

    body.dark-mode .subtitle,
    body.dark-mode .counter-label,
    body.dark-mode .small-note {
      color: #c9b9a8;
    }

    body.dark-mode .divider {
      border-bottom-color: #555;
    }

    @media print {
      body {
        background: white;
      }
      .snow {
        display: none;
      }
      .frame {
        box-shadow: none;
        border-width: 0;
        margin: 0;
        padding: 20px;
        background: white;
      }
      .heart {
        animation: none !important;
      }
    }

    @media (max-width: 600px) {
      .frame {
        padding: 20px 16px;
      }
      .title-number {
        font-size: 5vh;
      }
      .title-text {
        font-size: 3.5vh;
      }
      .rows {
        font-size: 2vh;
      }
    }

  </style>
</head>
<body>
  <div class="snow"></div>

  <div class="frame">
    <div>
      <div class="title-number" id="yearsText">0</div>
      <div class="title-text">rocznica</div>
      <div class="subtitle">od początku naszej wspólnej przygody</div>
    </div>

    <div class="heart"></div>

    <div>
      <div class="counter-label">Wspólnie przeżyliśmy:</div>
      <div class="rows">
        <div class="row"><span class="value" id="monthsText">0</span><span>miesięcy</span></div>
        <div class="row"><span class="value" id="weeksText">0</span><span>tygodni</span></div>
        <div class="row"><span class="value" id="daysText">0</span><span>dni</span></div>
        <div class="row"><span class="value" id="hoursText">0</span><span>godzin</span></div>
        <div class="row"><span class="value" id="minutesText">0</span><span>minut</span></div>
        <div class="row"><span class="value" id="secondsText">0</span><span>sekund</span></div>
      </div>

      <div class="small-note">…i wciąż liczymy dalej <span class="heart-icon">♥</span></div>
    </div>

    <div>
      <div class="divider"></div>
      <div class="bottom-text">na zawsze razem</div>
      <div class="names-line">
        TY &nbsp; I &nbsp; ASIA
        <span class="heart-small">❤</span>
        <span>23.08.2019 • Energylandia, Zator</span>
      </div>
      <div class="hashtag">#naszahistoria</div>
    </div>
  </div>

  <button class="theme-toggle" id="themeBtn">🌙</button>

  <script>
    const start = new Date("2019-08-23T00:00:00");

    function initTheme() {
      const saved = localStorage.getItem('theme') || 'light';
      if (saved === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').textContent = '☀️';
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    }

    function update() {
      const now = new Date();
      const diffMs = now - start;

      const totalSeconds = Math.floor(diffMs / 1000);
      const totalMinutes = Math.floor(diffMs / (1000 * 60));
      const totalHours   = Math.floor(diffMs / (1000 * 60 * 60));
      const totalDays    = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const totalWeeks   = Math.floor(totalDays / 7);
      const totalMonths  = Math.floor(totalDays / 30.44);

      document.getElementById("yearsText").textContent   = Math.floor(totalMonths / 12);
      document.getElementById("monthsText").textContent  = totalMonths.toLocaleString("pl-PL");
      document.getElementById("weeksText").textContent   = totalWeeks.toLocaleString("pl-PL");
      document.getElementById("daysText").textContent    = totalDays.toLocaleString("pl-PL");
      document.getElementById("hoursText").textContent   = totalHours.toLocaleString("pl-PL");
      document.getElementById("minutesText").textContent = totalMinutes.toLocaleString("pl-PL");
      document.getElementById("secondsText").textContent = totalSeconds.toLocaleString("pl-PL");
    }

    let lastConfettiTime = 0;
    function createConfetti() {
      const now = Date.now();
      if (now - lastConfettiTime < 500) return;
      lastConfettiTime = now;

      for (let i = 0; i < 30; i++) {
        const confetti = document.createElement('div');
        const heartX = window.innerWidth / 2;
        const heartY = window.innerHeight / 2;
        confetti.style.position = 'fixed';
        confetti.style.left = heartX + 'px';
        confetti.style.top = heartY + 'px';
        confetti.style.width = Math.random() * 6 + 4 + 'px';
        confetti.style.height = confetti.style.width;
        confetti.style.backgroundColor = ['#e32652', '#ff4373', '#ffb3c1'][Math.floor(Math.random() * 3)];
        confetti.style.borderRadius = '50%';
        confetti.style.pointerEvents = 'none';
        confetti.style.animation = 'fall 2.5s ease-out forwards';
        confetti.style.zIndex = '0';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 2500);
      }
    }

    const style = document.createElement('style');
    style.textContent = `
      @keyframes fall {
        to {
          transform: translateY(100vh) rotate(360deg);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);

    document.querySelector('.heart').addEventListener('click', createConfetti);
    document.getElementById('themeBtn').addEventListener('click', toggleTheme);

    initTheme();
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
